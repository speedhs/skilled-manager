name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: Run Core Tests with Race Detector
        run: |
          go test -v -race ./pkg/core/...

      - name: Verify CLI Static Build (CGO_ENABLED=0)
        shell: bash
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/skills ./cmd/skills
          ./bin/skills targets || ./bin/skills.exe targets
