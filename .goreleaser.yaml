version: 2

project_name: skills-manager

before:
  hooks:
    - go mod tidy

builds:
  - id: skills-cli
    main: ./cmd/skills
    binary: skills
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
      - freebsd
    goarch:
      - amd64
      - arm64
      - arm
      - "386"
    ignore:
      - goos: darwin
        goarch: "386"
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
      - goos: freebsd
        goarch: arm
      - goos: freebsd
        goarch: "386"
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/speedhs/skilled-manager/internal/version.Version={{ .Version }}
      - -X github.com/speedhs/skilled-manager/internal/version.Commit={{ .Commit }}
      - -X github.com/speedhs/skilled-manager/internal/version.Date={{ .Date }}

archives:
  - id: skills-cli-archive
    builds:
      - skills-cli
    name_template: "{{ .ProjectName }}-cli_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - packaging/UNSIGNED.txt

checksum:
  name_template: checksums.txt

signs:
  - cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - --yes
      - --output-signature=${signature}
      - --output-certificate=${certificate}
      - ${artifact}
    artifacts: checksum

sboms:
  - artifacts: archive

nfpms:
  - id: skills
    package_name: skills-manager
    builds:
      - skills-cli
    vendor: speedhs
    homepage: https://github.com/speedhs/skilled-manager
    maintainer: speedhs <speedhs@users.noreply.github.com>
    description: Manage AI agent skills for Claude Code, Codex, OpenCode, and Gemini CLI.
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/bin

brews:
  - name: skills
    repository:
      owner: speedhs
      name: homebrew-tap
    homepage: https://github.com/speedhs/skilled-manager
    description: Manage AI agent skills for Claude Code, Codex, OpenCode, and Gemini CLI.
    license: MIT
    skip_upload: true

scoops:
  - name: skills
    repository:
      owner: speedhs
      name: scoop-bucket
    homepage: https://github.com/speedhs/skilled-manager
    description: Manage AI agent skills for Claude Code, Codex, OpenCode, and Gemini CLI.
    license: MIT
    skip_upload: true

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: conventional
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: speedhs
    name: skilled-manager
  draft: false
  prerelease: auto
