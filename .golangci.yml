version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - os.Remove
        - os.RemoveAll
        - (*os.File).Close
        - io.Copy
    gosec:
      # Skill files are shared data, so 0644 and 0755 are intentional.
      # Paths come from the user and from the canonical store; G304 flags every open.
      excludes:
        - G301
        - G302
        - G304
        - G306
  exclusions:
    presets:
      - common-false-positives
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
    paths:
      - third_party$
      - builtin$
      - examples$

formatters:
  enable:
    - gofmt
